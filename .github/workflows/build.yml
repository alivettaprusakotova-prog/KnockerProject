name: Build AI Knocker jar

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean build 2>&1 | tee build.log

      - name: Save failed build log to branch
        if: failure()
        run: |
          git config user.name "arena-agent"
          git config user.email "agent@users.noreply.github.com"
          git add -f build.log
          git commit -m "ci: save failed build log [skip ci]" || true
          git push

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: AI-Knocker-DarkRomance
          path: build/libs/*.jar
          if-no-files-found: error
